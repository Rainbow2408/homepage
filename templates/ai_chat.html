{% extends "base.html" %}

{% block title %}AI 對話助理 | 王唯任個人網站{% endblock %}

{% block content %}
<section id="ai-chat-section" class="reveal visible" style="padding-top: 140px; min-height: 80vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 800px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <p class="section-eyebrow">AI 智慧工具</p>
      <h2 class="section-title" style="margin-bottom: 12px;">文生文對話助理</h2>
      <p style="color: var(--text-dim); font-size: 0.95rem;">使用 OpenAI gpt-4o-mini 模型提供即時對話回覆</p>
    </div>

    <!-- Chat Glass Container -->
    <div class="chat-container">
      <div class="chat-log" id="chat-log">
        <!-- Welcoming Message -->
        <div class="chat-message ai">
          <div class="chat-avatar">🤖</div>
          <div class="chat-bubble">
            您好！我是您的 AI 助理，有什麼我可以協助您的嗎？請在下方輸入框輸入您的問題。
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div class="chat-loading" id="chat-loading" style="display: none;">
        <span class="spinner"></span>
        <span>AI 正在思考中...</span>
      </div>

      <!-- Input Panel -->
      <div class="chat-input-panel">
        <textarea id="user-prompt" placeholder="請輸入您的問題... (按 Ctrl+Enter 可以送出)" rows="2"></textarea>
        <button id="send-btn" onclick="sendChatMessage()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
          送出
        </button>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const chatLog = document.getElementById('chat-log');
  const userPrompt = document.getElementById('user-prompt');
  const sendBtn = document.getElementById('send-btn');
  const chatLoading = document.getElementById('chat-loading');

  // Support Ctrl+Enter to send
  userPrompt.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
      e.preventDefault();
      sendChatMessage();
    }
  });

  function scrollToBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function appendMessage(role, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `chat-message ${role}`;

    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'chat-avatar';
    avatarDiv.textContent = role === 'user' ? '👤' : '🤖';

    const bubbleDiv = document.createElement('div');
    bubbleDiv.className = 'chat-bubble';
    bubbleDiv.textContent = text;

    msgDiv.appendChild(avatarDiv);
    msgDiv.appendChild(bubbleDiv);
    chatLog.appendChild(msgDiv);
    scrollToBottom();
  }

  async function sendChatMessage() {
    const promptText = userPrompt.value.trim();
    if (!promptText) return;

    // Clear input & append user message
    userPrompt.value = '';
    appendMessage('user', promptText);

    // Disable UI
    userPrompt.disabled = true;
    sendBtn.disabled = true;
    chatLoading.style.display = 'flex';
    scrollToBottom();

    try {
      const response = await fetch("{{ url_for('ai_chat') }}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt: promptText })
      });

      const data = await response.json();
      chatLoading.style.display = 'none';

      if (response.ok && data.success) {
        appendMessage('ai', data.reply);
      } else {
        appendMessage('ai', `錯誤: ${data.error || '無法取得伺服器回覆。'}`);
      }
    } catch (err) {
      chatLoading.style.display = 'none';
      appendMessage('ai', `系統異常: ${err.message}`);
    } finally {
      // Re-enable UI
      userPrompt.disabled = false;
      sendBtn.disabled = false;
      userPrompt.focus();
      scrollToBottom();
    }
  }
</script>
{% endblock %}
