{% extends "base.html" %}

{% block title %}AI 圖像生成器 | 王唯任個人網站{% endblock %}

{% block content %}
<section id="ai-image-section" class="reveal visible" style="padding-top: 140px; min-height: 80vh; display: flex; align-items: center; padding-bottom: 80px;">
  <div class="container" style="max-width: 800px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <p class="section-eyebrow">AI 智慧工具</p>
      <h2 class="section-title" style="margin-bottom: 12px;">文生圖生成器</h2>
      <p style="color: var(--text-dim); font-size: 0.95rem;">輸入文字敘述，選擇長寬組合，即可由 AI 繪製專屬圖片</p>
    </div>

    <!-- Generator Panel -->
    <div class="glass-card" style="padding: 32px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-glass);">
      <div id="input-form">
        <!-- Prompt Input -->
        <div class="form-group" style="margin-bottom: 24px;">
          <label for="image-prompt" style="font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; display: block;">圖片文字描述 (Prompt)</label>
          <textarea id="image-prompt" placeholder="請描述您想生成的圖片內容，英文描述效果較佳 (例如: 'a futuristic laboratory in neon cyber-punk style, masterwork, 8k resolution')..." rows="4" style="width: 100%; border-radius: 12px; padding: 16px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); resize: none; box-sizing: border-box;"></textarea>
        </div>

        <!-- Size Selector -->
        <div class="form-group" style="margin-bottom: 32px;">
          <label for="image-size" style="font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; display: block;">選擇圖片尺寸 (長寬組合)</label>
          <div class="select-wrapper">
            <select id="image-size" style="width: 100%; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-family: var(--font-b); cursor: pointer; outline: none; box-sizing: border-box;">
              <option value="1024x1024">1024 x 1024 (正方形 1:1) - DALL-E 3</option>
              <option value="1024x1792">1024 x 1792 (直式 9:16) - DALL-E 3</option>
              <option value="1792x1024">1792 x 1024 (橫式 16:9) - DALL-E 3</option>
              <option value="512x512">512 x 512 (標準正方形) - DALL-E 2</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <button id="generate-btn" class="form-submit" onclick="generateImage()" style="width: 100%; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          開始生成圖片
        </button>
      </div>

      <!-- Loading State -->
      <div id="image-loading" style="display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; text-align: center; gap: 16px;">
        <span class="spinner" style="width: 44px; height: 44px; border-width: 4px;"></span>
        <div style="font-weight: 500; font-size: 1.05rem; color: #fff;">AI 畫布繪製中...</div>
        <p style="color: var(--text-dim); font-size: 0.85rem; max-width: 320px;">DALL-E 模型正在依據您的描述進行光影繪製，這通常需要約 10-15 秒。</p>
      </div>

      <!-- Result State -->
      <div id="image-result" style="display: none; flex-direction: column; align-items: center; text-align: center; gap: 24px; padding-top: 16px;">
        <div style="font-weight: 600; font-size: 1.1rem; color: #86EFAC; display: flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          圖片生成成功！
        </div>
        <div id="warning-notice" style="color: #FBBF24; font-size: 0.88rem; display: none; max-width: 420px; line-height: 1.5; margin-top: -12px; font-weight: 500;"></div>

        <div class="result-image-wrapper" style="position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #1f2937; max-width: 100%;">
          <img id="result-image" src="" alt="AI Generated Image" style="max-width: 100%; height: auto; display: block;" />
        </div>

        <div style="display: flex; gap: 14px; width: 100%; flex-wrap: wrap;">
          <a id="download-link" href="" target="_blank" class="btn-primary" style="flex: 1; display: inline-flex; justify-content: center; align-items: center; text-decoration: none; font-size: 0.9rem; padding: 12px 20px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
            在新分頁開啟原圖
          </a>
          <button onclick="resetGenerator()" class="btn-ghost" style="flex: 1; font-size: 0.9rem; padding: 12px 20px;">
            生成另一張
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const inputForm = document.getElementById('input-form');
  const imagePrompt = document.getElementById('image-prompt');
  const imageSize = document.getElementById('image-size');
  const imageLoading = document.getElementById('image-loading');
  const imageResult = document.getElementById('image-result');
  const resultImage = document.getElementById('result-image');
  const downloadLink = document.getElementById('download-link');

  async function generateImage() {
    const prompt = imagePrompt.value.trim();
    if (!prompt) {
      alert("請輸入圖片文字描述！");
      return;
    }

    const size = imageSize.value;

    // Transition UI
    inputForm.style.display = 'none';
    imageLoading.style.display = 'flex';

    try {
      const response = await fetch("{{ url_for('ai_image') }}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt: prompt, size: size })
      });

      // Check Content-Type before parsing JSON
      const contentType = response.headers.get('Content-Type') || '';
      if (!contentType.includes('application/json')) {
        imageLoading.style.display = 'none';
        alert(`伺服器回傳非預期的格式（HTTP ${response.status}），請稍後再試。`);
        resetGenerator();
        return;
      }

      const data = await response.json();
      imageLoading.style.display = 'none';

      if (response.ok && data.success) {
        resultImage.src = data.url;
        downloadLink.href = data.url;
        
        const warningNotice = document.getElementById('warning-notice');
        if (data.warning) {
          warningNotice.textContent = data.warning;
          warningNotice.style.display = 'block';
        } else {
          warningNotice.style.display = 'none';
        }
        
        imageResult.style.display = 'flex';
      } else {
        alert(`錯誤: ${data.error || '生成失敗。'}`);
        resetGenerator();
      }
    } catch (err) {
      imageLoading.style.display = 'none';
      alert(`網路連線失敗，請檢查互聯網連線後再試。`);
      resetGenerator();
    }
  }

  function resetGenerator() {
    imageResult.style.display = 'none';
    imageLoading.style.display = 'none';
    inputForm.style.display = 'block';
    imagePrompt.focus();
  }
</script>
{% endblock %}
